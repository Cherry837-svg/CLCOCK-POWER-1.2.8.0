<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Digital Clock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body,.screen{width:100%;height:100%;overflow:hidden;background:#000}body{font-family:"Courier New",monospace;color:#0f0}.screen{position:fixed;inset:0}.battery-percent{position:absolute;top:3vh;left:50%;transform:translateX(-50%);font-size:clamp(14px,4vw,22px);font-weight:900}.rainbow-bar{position:absolute;top:16vh;left:50%;transform:translateX(-50%);width:70vw;max-width:600px;height:7px;background:#111;border-radius:20px;overflow:hidden}.rainbow-fill{height:100%;width:0;border-radius:20px;transition:.35s;background:#f00}.clock-container{position:absolute;inset:50% 0 auto;transform:translateY(-50%);display:flex;justify-content:center}.main-time{display:flex;align-items:center;font-size:clamp(60px,19vw,150px);font-weight:900;line-height:1;white-space:nowrap;text-shadow:0 0 5px #0f05}.main-colon{margin:0 .04em}.seconds-zone{display:inline-flex;margin-left:.04em}.seconds-display{font-size:.42em;transform:translateY(.12em)}.seconds-off .seconds-zone{display:none}.date-display{position:absolute;bottom:16vh;left:50%;transform:translateX(-50%);font-size:clamp(16px,4.5vw,27px);font-weight:900;white-space:nowrap}.screen-status{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:8px;font-size:clamp(10px,2.7vw,15px)}.battery-circle{position:absolute;bottom:3.5vh;left:50%;transform:translateX(-50%);width:clamp(45px,9vw,75px);height:clamp(45px,9vw,75px)}.battery-circle canvas{width:100%;height:100%}.battery-circle-inner{position:absolute;inset:14%;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.7vw,19px);font-weight:900}.battery-triangle{position:absolute;bottom:8.2vh;width:0;height:0}.triangle-left{right:calc(50% + 55px);border:9px solid transparent;border-top:18px solid #f00}.triangle-right{left:calc(50% + 55px);border:9px solid transparent;border-bottom:15px solid #0f0}@media(max-width:500px){.battery-percent{top:2vh}.rainbow-bar{top:10vh;width:78vw}.date-display{bottom:9vh}.battery-circle{bottom:2vh}.battery-triangle{bottom:3.5vh}.triangle-left{right:calc(50% + 43px)}.triangle-right{left:calc(50% + 43px)}}
</style>
</head>
<body><main class="screen" id="screen">
<div class="battery-percent" id="batteryPercent">--%</div><div class="rainbow-bar"><div class="rainbow-fill" id="rainbowFill"></div></div>
<div class="clock-container"><div class="main-time" id="mainTime"><span id="hours">00</span><span class="main-colon" id="colon">:</span><span id="minutes">00</span><span class="seconds-zone" id="secondsZone"><span class="seconds-display" id="seconds">00</span></span></div></div>
<div class="date-display" id="dateDisplay"><span id="dateText">00 00 0000</span><span class="screen-status" id="status"></span></div>
<div class="battery-triangle triangle-left"></div><div class="battery-triangle triangle-right"></div><div class="battery-circle"><canvas id="canvas"></canvas><div class="battery-circle-inner" id="circle">--</div></div></main>
<script>
const $=id=>document.getElementById(id),screenEl=$('screen'),ctx=$('canvas').getContext('2d');let showSeconds=true,lastTap=0;
function clock(){let n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0'),s=String(n.getSeconds()).padStart(2,'0');$('hours').textContent=h;$('minutes').textContent=m;$('seconds').textContent=s;$('dateText').firstChild.textContent=`${String(n.getDate()).padStart(2,'0')} ${String(n.getMonth()+1).padStart(2,'0')} ${n.getFullYear()}`;$('secondsZone').style.display=showSeconds?'inline-flex':'none';$('colon').style.opacity=showSeconds||n.getSeconds()%2?'1':'0'}clock();setInterval(clock,1000);
function draw(level){let c=$('canvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);let x=r.width/2,y=r.height/2,rad=Math.min(r.width,r.height)/2-5,a=level/100*Math.PI*2,color=level<30?'#f00':level<60?'#ff0':'#0f0';ctx.clearRect(0,0,r.width,r.height);ctx.beginPath();ctx.arc(x,y,rad,-Math.PI/2,-Math.PI/2+a);ctx.strokeStyle=color;ctx.lineWidth=5;ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=7;ctx.stroke();$('rainbowFill').style.width=level+'%';$('rainbowFill').style.background=`linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#80f)`;$('batteryPercent').textContent=level+'%';$('circle').textContent=level+'%'}
if(navigator.getBattery)navigator.getBattery().then(b=>{let u=()=>draw(Math.round(b.level*100));u();b.onlevelchange=u});$('secondsZone').onclick=()=>{let n=Date.now();if(n-lastTap<350){showSeconds=!showSeconds;clock();$('status').textContent=showSeconds?'SECONDS ON':'SECONDS OFF';setTimeout(()=>$('status').textContent='',1000)}lastTap=n};screenEl.onclick=e=>{if(e.target.closest('#secondsZone'))return};
</script></body></html>
